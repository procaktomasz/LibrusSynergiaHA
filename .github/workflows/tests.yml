name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Kompilacja (błędy składni)
        run: python -m compileall -q custom_components tests

      - name: Zależności testowe
        run: pip install pytest-homeassistant-custom-component "librus-apix>=1.5.2"

      - name: Pytest
        run: python -m pytest -q tests
